name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)(\.[0-9]+)?)?$ ]]; then
            echo "Unsupported release tag format: ${GITHUB_REF_NAME}"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tauri_version" ]]; then
            echo "package.json version ${package_version} does not match Tauri version ${tauri_version}."
            exit 1
          fi
          if [[ "$tag_version" != "$tauri_version" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match app version v${tauri_version}."
            exit 1
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Create draft release and generate notes
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          generateReleaseNotes: true

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: nsis
          - label: macOS
            os: macos-latest
            bundles: "app dmg"
          - label: Linux
            os: ubuntu-latest
            bundles: "deb appimage"

    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate updater signing secret
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for signed updater release assets."
          }

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sidecar/ai-switch-tsnet/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute platform variables
        shell: pwsh
        run: |
          $hostTriple = ((rustc -vV | Select-String '^host:') -replace '^host:\s*', '').Trim()
          $exeSuffix = ""
          if ($env:RUNNER_OS -eq "Windows") {
            $exeSuffix = ".exe"
          }

          $arch = switch ($env:RUNNER_ARCH) {
            "X64" { "x86_64" }
            "ARM64" { "aarch64" }
            default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          }

          $platform = switch ($env:RUNNER_OS) {
            "Windows" { "windows-$arch" }
            "macOS" { "darwin-$arch" }
            "Linux" { "linux-$arch" }
            default { throw "Unsupported runner OS: $env:RUNNER_OS" }
          }

          "HOST_TRIPLE=$hostTriple" >> $env:GITHUB_ENV
          "EXE_SUFFIX=$exeSuffix" >> $env:GITHUB_ENV
          "UPDATER_PLATFORM=$platform" >> $env:GITHUB_ENV
          "SIDECAR_BIN=src-tauri/binaries/ai-switch-tsnet-$hostTriple$exeSuffix" >> $env:GITHUB_ENV
          "SERVER_BIN=src-tauri/target/release/ai-switch-server$exeSuffix" >> $env:GITHUB_ENV

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm test:run
          pnpm release:manifest:test

      - name: Build frontend assets
        run: pnpm build

      - name: Run sidecar tests
        working-directory: sidecar/ai-switch-tsnet
        run: go test ./...

      - name: Build sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Push-Location sidecar/ai-switch-tsnet
          go build -trimpath -ldflags="-s -w" -o "../../$env:SIDECAR_BIN" .
          Pop-Location
          if (-not (Test-Path $env:SIDECAR_BIN)) {
            throw "Missing sidecar binary: $env:SIDECAR_BIN"
          }

      - name: Run Rust checks
        run: |
          pnpm rust:check
          pnpm rust:test

      - name: Build standalone server
        run: pnpm server:build:release

      - name: Build Tauri bundle
        shell: pwsh
        run: |
          $bundles = "${{ matrix.bundles }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          & pnpm tauri build --ci --bundles @bundles

      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dest = "release-assets/$env:UPDATER_PLATFORM"
          New-Item -ItemType Directory -Force $dest | Out-Null

          $bundleFiles = Get-ChildItem src-tauri/target/release/bundle -Recurse -File |
            Where-Object {
              $_.Name -match '\.(exe|msi|dmg|deb|AppImage|zip|tar\.gz|sig)$'
            }

          if (-not $bundleFiles) {
            throw "No Tauri bundle assets found."
          }

          foreach ($file in $bundleFiles) {
            $safeName = ("ai-switch_{0}_{1}_{2}" -f $tag, $env:UPDATER_PLATFORM, $file.Name) -replace '[^\w.\-]+', '-'
            Copy-Item $file.FullName (Join-Path $dest $safeName)
          }

          $serverArchive = Join-Path $dest "ai-switch-server_${tag}_$env:UPDATER_PLATFORM.zip"
          $sidecarArchive = Join-Path $dest "ai-switch-tsnet_${tag}_$env:UPDATER_PLATFORM.zip"
          Compress-Archive -Path $env:SERVER_BIN -DestinationPath $serverArchive -Force
          Compress-Archive -Path $env:SIDECAR_BIN -DestinationPath $sidecarArchive -Force

          $signatureCount = (Get-ChildItem $dest -Filter *.sig -File).Count
          if ($signatureCount -lt 1) {
            throw "No Tauri updater signature files were staged."
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPDATER_PLATFORM }}
          path: release-assets/${{ env.UPDATER_PLATFORM }}
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Read generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" --jq '.body // ""' > release-notes.md

      - name: Generate updater manifest
        run: |
          node scripts/create-updater-manifest.mjs \
            --assets-dir release-assets \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --notes-file release-notes.md

      - name: Verify updater signature keys
        run: node scripts/verify-updater-signatures.mjs --manifest release-assets/latest.json --tauri-config src-tauri/tauri.conf.json

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          generateReleaseNotes: false
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/**/*.*"
