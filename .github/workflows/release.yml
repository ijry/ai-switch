name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare GitHub Release
    runs-on: ubuntu-latest
    outputs:
      release_notes: ${{ steps.notes.outputs.body }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha)(\.[0-9]+)?)?$ ]]; then
            echo "Unsupported release tag format: ${GITHUB_REF_NAME}"
            exit 1
          fi
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$package_version" != "$tauri_version" ]]; then
            echo "package.json version ${package_version} does not match Tauri version ${tauri_version}."
            exit 1
          fi
          if [[ "$tag_version" != "$tauri_version" ]]; then
            echo "Release tag ${GITHUB_REF_NAME} does not match app version v${tauri_version}."
            exit 1
          fi

      - name: Check tag commit belongs to default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF_NAME")"
          if ! git merge-base --is-ancestor "$tag_commit" "origin/$DEFAULT_BRANCH"; then
            echo "Tag ${GITHUB_REF_NAME} is not based on ${DEFAULT_BRANCH}."
            exit 1
          fi

      - name: Collect release notes from the tag commit
        id: notes
        shell: bash
        run: |
          # The bilingual changelog is the tag commit's message (see the release
          # rules in AGENTS.md). GitHub's generated notes are not a substitute:
          # for a release tag they only produce a compare link, which is what the
          # updater manifest used to ship as its entire release notes.
          git log -1 --format=%B "$GITHUB_SHA" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Tag commit ${GITHUB_SHA} has an empty message; release notes would be blank." >&2
            exit 1
          fi
          delimiter="release-notes-$(openssl rand -hex 8)"
          {
            echo "body<<${delimiter}"
            cat release-notes.md
            echo "${delimiter}"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          bodyFile: release-notes.md

  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            os: windows-latest
            bundles: nsis
          - label: macOS (Apple Silicon)
            os: macos-latest
            bundles: "app dmg"
          # An arm64 dmg does not run on an Intel Mac at all — not even under
          # Rosetta — so the second macOS row is the whole of Intel support.
          # `macos-15-intel` is the label that replaced the retired `macos-13`
          # image; GitHub has announced it as the last x86_64 macOS image
          # Actions will offer, available until August 2027. Building natively
          # rather than cross-compiling from the arm runner is what keeps
          # `go test`, `cargo test` and the frontend suite running on the
          # architecture that actually ships.
          - label: macOS (Intel)
            os: macos-15-intel
            bundles: "app dmg"
          - label: Linux
            os: ubuntu-latest
            bundles: "deb appimage"

    env:
      CI: true
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate updater signing secret
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for signed updater release assets."
          }

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            gcc-aarch64-linux-gnu

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache-dependency-path: sidecar/ai-switch-tsnet/go.sum

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Compute platform variables
        shell: pwsh
        run: |
          $hostTriple = ((rustc -vV | Select-String '^host:') -replace '^host:\s*', '').Trim()
          $exeSuffix = ""
          if ($env:RUNNER_OS -eq "Windows") {
            $exeSuffix = ".exe"
          }

          $arch = switch ($env:RUNNER_ARCH) {
            "X64" { "x86_64" }
            "ARM64" { "aarch64" }
            default { throw "Unsupported runner architecture: $env:RUNNER_ARCH" }
          }

          $platform = switch ($env:RUNNER_OS) {
            "Windows" { "windows-$arch" }
            "macOS" { "darwin-$arch" }
            "Linux" { "linux-$arch" }
            default { throw "Unsupported runner OS: $env:RUNNER_OS" }
          }

          "HOST_TRIPLE=$hostTriple" >> $env:GITHUB_ENV
          "EXE_SUFFIX=$exeSuffix" >> $env:GITHUB_ENV
          "UPDATER_PLATFORM=$platform" >> $env:GITHUB_ENV
          "APP_VERSION=$("${{ github.ref_name }}" -replace '^v', '')" >> $env:GITHUB_ENV
          "SIDECAR_BIN=src-tauri/binaries/ai-switch-tsnet-$hostTriple$exeSuffix" >> $env:GITHUB_ENV
          "SERVER_BIN=src-tauri/target/release/ai-switch-server$exeSuffix" >> $env:GITHUB_ENV
          if ($env:RUNNER_OS -eq "Linux") {
            "SIDECAR_ARM64_BIN=src-tauri/binaries/ai-switch-tsnet-aarch64-unknown-linux-gnu" >> $env:GITHUB_ENV
            "SERVER_ARM64_BIN=src-tauri/target/aarch64-unknown-linux-gnu/release/ai-switch-server" >> $env:GITHUB_ENV
          }

      - name: Run frontend checks
        run: |
          pnpm typecheck
          pnpm test:run
          pnpm release:manifest:test

      - name: Build frontend assets
        run: pnpm build

      - name: Run sidecar tests
        working-directory: sidecar/ai-switch-tsnet
        run: go test ./...

      - name: Build sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/binaries | Out-Null
          Push-Location sidecar/ai-switch-tsnet
          go build -trimpath -ldflags="-s -w" -o "../../$env:SIDECAR_BIN" .
          Pop-Location
          if (-not (Test-Path $env:SIDECAR_BIN)) {
            throw "Missing sidecar binary: $env:SIDECAR_BIN"
          }

      - name: Run Rust checks
        run: |
          pnpm rust:check
          pnpm rust:test

      - name: Build Tauri bundle
        shell: pwsh
        run: |
          $bundles = "${{ matrix.bundles }}".Split(" ", [System.StringSplitOptions]::RemoveEmptyEntries)
          & pnpm tauri build --ci --bundles @bundles

      - name: Patch AppImage for Wayland compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: bash src-tauri/scripts/patch-appimage-wayland.sh

      - name: Build standalone server
        run: pnpm server:build:release

      - name: Build Linux ARM64 standalone server
        if: runner.os == 'Linux'
        shell: bash
        run: |
          rustup target add aarch64-unknown-linux-gnu
          cd sidecar/ai-switch-tsnet
          GOARCH=arm64 go build -trimpath -ldflags="-s -w" \
            -o "../../$SIDECAR_ARM64_BIN" .
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          cd src-tauri
          cargo build --release --target aarch64-unknown-linux-gnu \
            --no-default-features --features standalone-server \
            --bin ai-switch-server

      - name: Stage release assets
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $dest = "release-assets/$env:UPDATER_PLATFORM"
          New-Item -ItemType Directory -Force $dest | Out-Null

          # GitHub sorts the release page's asset list by name and folds all but
          # the first few away, so the installers are named to sort ahead of the
          # server and sidecar archives. See scripts/stage-release-assets.mjs.
          node scripts/stage-release-assets.mjs `
            --bundle-dir src-tauri/target/release/bundle `
            --dest $dest `
            --platform $env:UPDATER_PLATFORM `
            --version $env:APP_VERSION
          if ($LASTEXITCODE -ne 0) {
            throw "Staging the Tauri bundle assets failed."
          }

          function Stage-ServerArchive {
            param(
              [string] $ServerBin,
              [string] $SidecarBin,
              [string] $Platform,
              [string] $ExeSuffix,
              [bool] $IncludeLinuxHelpers
            )
            $serverStage = "server-bundle-$Platform"
            if (Test-Path $serverStage) { Remove-Item -Recurse -Force $serverStage }
            New-Item -ItemType Directory -Force $serverStage | Out-Null
            New-Item -ItemType Directory -Force "release-assets/$Platform" | Out-Null
            Copy-Item $ServerBin (Join-Path $serverStage (Split-Path $ServerBin -Leaf))
            Copy-Item $SidecarBin (Join-Path $serverStage "ai-switch-tsnet$ExeSuffix")
            Copy-Item dist (Join-Path $serverStage "web") -Recurse
            if (-not (Test-Path (Join-Path $serverStage "web/index.html"))) {
              throw "Server bundle is missing web/index.html"
            }
            if ($IncludeLinuxHelpers) {
              Copy-Item scripts/install-server.sh (Join-Path $serverStage "install-server.sh")
              Copy-Item deploy/ai-switch-server.service (Join-Path $serverStage "ai-switch-server.service")
            }
            $serverArchive = Join-Path "release-assets/$Platform" "ai-switch-server_${tag}_${Platform}.zip"
            $sidecarArchive = Join-Path "release-assets/$Platform" "ai-switch-tsnet_${tag}_${Platform}.zip"
            Compress-Archive -Path "$serverStage/*" -DestinationPath $serverArchive -Force
            Compress-Archive -Path $SidecarBin -DestinationPath $sidecarArchive -Force
          }

          Stage-ServerArchive `
            -ServerBin $env:SERVER_BIN `
            -SidecarBin $env:SIDECAR_BIN `
            -Platform $env:UPDATER_PLATFORM `
            -ExeSuffix $env:EXE_SUFFIX `
            -IncludeLinuxHelpers ("${{ matrix.label }}" -eq "Linux")

          if ("${{ matrix.label }}" -eq "Linux") {
            Stage-ServerArchive `
              -ServerBin $env:SERVER_ARM64_BIN `
              -SidecarBin $env:SIDECAR_ARM64_BIN `
              -Platform "linux-aarch64" `
              -ExeSuffix "" `
              -IncludeLinuxHelpers $true
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.UPDATER_PLATFORM }}
          path: release-assets/**
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - prepare
      - build

    # actions: write is what the package-manager handoff at the end of this job
    # needs; the workflow-level default only grants contents: write.
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Restore release notes
        env:
          RELEASE_NOTES: ${{ needs.prepare.outputs.release_notes }}
        shell: bash
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "The prepare job produced no release notes for ${GITHUB_REF_NAME}." >&2
            exit 1
          fi

      - name: Generate updater manifest
        run: |
          node scripts/create-updater-manifest.mjs \
            --assets-dir release-assets \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-assets/latest.json \
            --notes-file release-notes.md

      - name: Verify updater signature keys
        run: node scripts/verify-updater-signatures.mjs --manifest release-assets/latest.json --tauri-config src-tauri/tauri.conf.json

      - name: Drop the signature files from the asset list
        shell: bash
        run: |
          # latest.json now carries every signature inline, and that manifest is
          # the only thing that reads them: the updater never fetches a sibling
          # .sig URL. Publishing them anyway only spends the handful of asset
          # rows GitHub shows before it folds the rest away.
          find release-assets -name '*.sig' -delete

      - name: Build the release body
        run: |
          node scripts/create-release-body.mjs \
            --assets-dir release-assets \
            --tag "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --output release-body.md \
            --notes-file release-notes.md

      - name: Create or update release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          allowUpdates: true
          bodyFile: release-body.md
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/**/*.*"

      - name: Hand the release to the package managers
        # package-managers.yml also listens for `release: published`, but that
        # event never fires for a release published here: GitHub does not start
        # workflow runs from events its own GITHUB_TOKEN created, and
        # ncipollo/release-action publishes with exactly that token. v0.8.1 went
        # out with no package-manager run at all as a result. workflow_dispatch is
        # one of the two documented exceptions to that rule, so the handoff is
        # made explicitly rather than left to the event.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          # Dispatched against the tag, so the manifests are rendered by the same
          # commit that produced the assets. A handoff that cannot be dispatched
          # must not turn an already published release red — the whole reason the
          # package managers live in their own workflow — so it warns and the run
          # can be repeated by hand with the same tag input.
          if ! gh workflow run package-managers.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$TAG" \
            -f tag="$TAG"; then
            echo "::warning::Could not dispatch package-managers.yml for ${TAG}. Run that workflow by hand with tag=${TAG}."
          fi
