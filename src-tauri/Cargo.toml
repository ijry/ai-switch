[package]
name = "ai-switch"
version = "0.8.1"
description = "AI provider and official account switcher"
authors = ["xyito"]
edition = "2021"
default-run = "ai-switch"

[lib]
name = "ai_switch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ai-switch"
path = "src/main.rs"

[[bin]]
name = "ai-switch-server"
path = "src/bin/ai_switch_server.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
toml_edit = "0.20.2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "net", "sync", "process", "signal", "time"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "macros", "chrono", "uuid", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["pkcs8"] }
directories = "5"
keyring = "3"
sha2 = "0.10"
tempfile = "3"
url = "2"
axum = { version = "0.7", features = ["ws"] }
axum-server = { version = "0.7", default-features = false, features = ["tls-rustls-no-provider"] }
tower-http = { version = "0.6", features = ["cors"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "system-proxy", "cookies", "stream"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
async-trait = "0.1"
portable-pty = "0.8"
rcgen = { version = "0.13", features = ["x509-parser"] }
sha1 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
x509-parser = "0.16"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }
winreg = "0.52"

# `statvfs`, for reading free space on the volumes the app writes to.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
assert_fs = "1"
